# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48 → 1.251 × 2,48 = 3.103 mỗi nhóm → 42 người mỗi nhóm, tổng 84 > 40 nhân viên: không đủ người
#   c) 20 nhân viên mỗi nhóm: trần c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: trần 6 / 0,02 = 300 < 1.251: không đạt, và chỉ 6 cụm (< 20)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m − 1) × 0,02) ≥ 859 → m ≥ 299 yêu cầu mỗi người (DE 6,96); nếu tác động thật chỉ 5 điểm thì power còn 0,64
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   (cách chia: theo nhân viên, 20 trợ lý + 20 đối chứng, phạm vi noi_dia + hang_nang)
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: bốc thăm bằng code với seed ghi trước, phân tầng theo depot; quản lý không được chọn người.
#   3. Ảnh hưởng gián tiếp và cách giảm: rủi ro nhân viên chia sẻ câu trả lời trong cùng depot; giảm bằng quyền truy cập theo tài khoản, log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chỉ số chính, mde 6 điểm, 3 luật dừng và decision_date chốt trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện): 20 + 20 nhân viên chỉ đủ mẫu cho mức chênh
#   6 điểm (cần m ≥ 299 yêu cầu mỗi người, DE 6,96), không đủ cho 5 điểm (trần 1.000 < 1.251). Nếu tác động
#   thật chỉ 5 điểm thì power còn 0,64. Giám đốc vận hành ký chấp nhận đánh đổi này trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: hiện tại 4,25% (51/1.200), trong phạm vi
#   noi_dia + hang_nang 3,97%. Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên so với nhóm đối chứng
#   (chênh ≥ +2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× của 12.000 đ, simulated), cả 12 depot với 40 nhân viên CSKH; loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"                 # 20 nhân viên dùng trợ lý, 20 đối chứng, bốc thăm phân tầng theo depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên; chỉ số chính chỉ đo từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi: 0,05 cần 1.251 mỗi nhóm, vượt trần 1.000 của 20 cụm
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96           # m = 299 yêu cầu mỗi nhân viên
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý"
    spillover_risk: "Nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý; giảm bằng phân quyền theo tài khoản và log lượt mở trợ lý theo staff_id, nhóm đối chứng có lượt mở thì loại khỏi phân tích"
    predeclared: "Chỉ số chính, mde 0,06, ba luật dừng và decision_date chốt bằng văn bản trước ngày bắt đầu 2026-12-07; seed bốc thăm ghi trước"
  stop_rules:
    # An toàn
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên, hoặc vượt 6%, hoặc có từ 1 ca hoàn tiền trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển toàn bộ yêu cầu về luồng nhân viên KHÔNG THÌ không được sang bước rollout tiếp theo"
    # Chi phí
    - "NẾU chi phí mỗi việc thành công đo thật vượt 8.000 đ (0,67× của 12.000 đ; đợt chạy thử 3.414 đ simulated trong phạm vi) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở thêm depot hay loại yêu cầu"
    # Mức độ sử dụng
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ) vượt 40% (đợt chạy thử 27,12%) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên và rà 20 trace bị bỏ trong 3 ngày làm việc KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bật cờ tắt trợ lý, hiệu lực trong 30 phút; yêu cầu đang mở chuyển về hàng đợi nhân viên tự làm như trước pilot, khách không phải gửi lại yêu cầu"
  # Bắt đầu 2026-12-07; bước 0.50 từ 2026-12-21, cần khoảng 10 ngày để mỗi người đủ 299 yêu cầu
  # (30,7 yêu cầu trong phạm vi/người/ngày), cộng 7 ngày chờ cửa sổ mở lại.
  decision_date: "2027-01-08"
  simulated_inputs:               # mọi con số giả lập đã dùng trong file này
    - "phut_xem_lai_simulated, phut_lam_lai_simulated (hai cột phút trong logix_requests.csv)"
    - "Chi phí mỗi việc thành công trong phạm vi 3.414 đ và tỉ lệ 0,22× / 0,69× / 0,85× / 1,88× của 12.000 đ (scope)"
    - "Mốc 3.414 đ trong luật dừng chi phí"
